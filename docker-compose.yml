services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laporsar_lite_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://laporsar_admin:laporsar_admin@db:5432/laporsar_master
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:3000
      - LOCAL_STORAGE_DIR=/app/uploads
      # AI Provider configurations will be read from .env
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/ready\")' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - laporsar_lite_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laporsar_lite_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - laporsar_lite_network

  db:
    image: postgis/postgis:16-3.4
    container_name: laporsar_lite_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=laporsar_admin
      - POSTGRES_PASSWORD=laporsar_admin
      - POSTGRES_DB=laporsar_master
    volumes:
      - postgres_lite_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laporsar_admin -d laporsar_master || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - laporsar_lite_network

  redis:
    image: redis:7-alpine
    container_name: laporsar_lite_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_lite_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - laporsar_lite_network

volumes:
  postgres_lite_data:
  redis_lite_data:

networks:
  laporsar_lite_network:
    driver: bridge
